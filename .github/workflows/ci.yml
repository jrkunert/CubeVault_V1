name: CubeVault CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubevault-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, Build, Test, and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOLUTION_FILE: CubeVault.sln
      CONFIGURATION: Release
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create validation output directory
        shell: bash
        run: mkdir -p artifacts/validation

      - name: Record SDK information
        shell: bash
        run: dotnet --info 2>&1 | tee artifacts/validation/dotnet-info.txt

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "${SOLUTION_FILE}"
            "src/CubeVault.Domain"
            "src/CubeVault.Application"
            "src/CubeVault.Infrastructure"
            "src/CubeVault.Shared"
            "src/CubeVault.Cli"
            "tests/CubeVault.Domain.Tests"
            "tests/CubeVault.Application.Tests"
            "tests/CubeVault.Infrastructure.Tests"
            "tests/CubeVault.Shared.Tests"
          )

          missing=0
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "ERROR: Required path is missing: $path" | tee -a artifacts/validation/structure-validation.txt
              missing=1
            else
              echo "OK: $path" | tee -a artifacts/validation/structure-validation.txt
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Repository structure validation failed." | tee -a artifacts/validation/structure-validation.txt
            exit 1
          fi

      - name: Restore solution
        shell: bash
        run: |
          set -o pipefail
          dotnet restore "${SOLUTION_FILE}" 2>&1 | tee artifacts/validation/restore.txt

      - name: Build solution
        shell: bash
        run: |
          set -o pipefail
          dotnet build "${SOLUTION_FILE}" \
            --configuration "${CONFIGURATION}" \
            --no-restore \
            2>&1 | tee artifacts/validation/build.txt

      - name: Test solution
        shell: bash
        run: |
          set -o pipefail
          dotnet test "${SOLUTION_FILE}" \
            --configuration "${CONFIGURATION}" \
            --no-build \
            --logger "trx;LogFileName=CubeVault.Tests.trx" \
            --results-directory artifacts/TestResults \
            2>&1 | tee artifacts/validation/test.txt

      - name: Validate repository cleanliness
        shell: bash
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r path; do
            echo "ERROR: Generated or machine-specific content found: $path" | tee -a artifacts/validation/cleanliness-validation.txt
            found=1
          done < <(
            find . -type f \
              \( -name '*.user' -o -name '*.suo' \) -print
            find . -type d \
              \( -name '.vs' -o -name 'bin' -o -name 'obj' -o -name 'TestResults' \) \
              -not -path './artifacts/TestResults' -print
          )

          if [[ "$found" -ne 0 ]]; then
            echo "Repository cleanliness validation failed." | tee -a artifacts/validation/cleanliness-validation.txt
            exit 1
          fi

          echo "Repository cleanliness validation passed." | tee artifacts/validation/cleanliness-validation.txt

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CubeVault CI Validation"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Configuration: \`${CONFIGURATION}\`"
            echo "- Solution: \`${SOLUTION_FILE}\`"
            echo "- Job result: \`${{ job.status }}\`"
            echo
            echo "Detailed logs are attached as the \`cubevault-ci-validation\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cubevault-ci-validation-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
